<html>
<head>
	<title>Canvas para dibujar</title>
</head>
<body>
	<canvas id="myCanvas" width="300" height="200" style="border:1px solid #000000;"></canvas>
	<script>
		var c = document.getElementById("myCanvas");
		var ctx = c.getContext("2d");
		ctx.moveTo(0, 0);
		ctx.lineTo(200, 100);
		ctx.stroke();
		ctx.beginPath();
		ctx.arc(95, 50, 40, 0, 2 * Math.PI);
		ctx.stroke();
	</script>
</body>
</html>
