<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<title>Login LocalStorage</title>
	<script src="../JS/DOM.js" defer></script>
</head>
<body class="p-4">
	<div class="container">
		<h1 class="mb-4">Inicio de sesión</h1>

		<div class="mb-3">
			<label for="Username" class="form-label">Usuario</label>
			<input type="text" class="form-control" id="Username" placeholder="Escribe tu usuario">
		</div>

		<div class="mb-3">
			<label for="Password" class="form-label">Contraseña</label>
			<input type="password" class="form-control" id="Password" placeholder="Escribe tu contraseña">
		</div>

		<div class="d-flex gap-2">
			<button type="button" class="btn btn-success" onclick="signUp()">Registrar</button>
			<button type="button" class="btn btn-primary" onclick="logIn()">Iniciar sesión</button>
			<button type="button" class="btn btn-danger" onclick="clearData()">Borrar datos</button>
			<script rel="text/javascript" src="../JS/login.js"></script>
		</div>
	</div>
</body>
</html>
